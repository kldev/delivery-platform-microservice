# Run Flyway migrations automatically
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db.migration

## db
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${PG_USER:platform}
quarkus.datasource.password = ${PG_PASSWORD:platform}
quarkus.datasource.reactive.url = vertx-reactive:postgresql://${PG_HOST:localhost}/notificationdb
## cors
quarkus.http.cors.enabled=false

## flyway connection
quarkus.datasource.jdbc.url=jdbc:postgresql://${PG_HOST:localhost}/notificationdb

%dev.notification.sql.log=true
%test.notification.sql.log=true
%prod.notification.sql.log=false

quarkus.http.port=${PORT:8005}

quarkus.smallrye-openapi.path=/api-spec
quarkus.smallrye-openapi.scan-exclude-profiles=root

##
mp.messaging.incoming.notifications.bootstrap.servers=${KAFKA_SERVERS:localhost:9092}

mp.messaging.incoming.notifications.connector=smallrye-kafka
mp.messaging.incoming.notifications.topic=(driver|delivery|settlement|payment)\..*
mp.messaging.incoming.notifications.pattern=true

mp.messaging.incoming.notifications.group.id=notification-service
mp.messaging.incoming.notifications.auto.offset.reset=earliest

mp.messaging.incoming.notifications.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notifications.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

%dev.quarkus.kafka.devservices.enabled=false
%test.quarkus.kafka.devservices.enabled=true
quarkus.rest-client.delivery-client.url=${DELIVERY_URL:http://localhost:8081}

#quarkus.log.category."io.vertx.core.impl.BlockedThreadChecker".level=DEBUG
#quarkus.log.category."io.smallrye.mutiny".level=DEBUG
#quarkus.log.category."io.quarkus.vertx".level=DEBUG
#quarkus.log.category."org.jboss.resteasy.reactive".level=DEBUG

##
scheduler.notifications.interval=${INTERVAL:30s}

##
delivery-client.api-key=${API_KEY:""}
